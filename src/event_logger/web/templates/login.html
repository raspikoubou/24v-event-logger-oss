<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ログイン - 設備イベントロガー</title>
  </head>
  <body>
    <main>
      <h1>設備イベントロガー</h1>
      {% if error_message %}<p role="alert">{{ error_message }}</p>{% endif %}
      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <label>共有パスワード<input type="password" name="password" required autofocus></label>
        <button type="submit">ログイン</button>
      </form>
    </main>
  </body>
</html>
