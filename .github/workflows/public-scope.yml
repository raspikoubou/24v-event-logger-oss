name: Public scope
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  public-scope:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python packaging/check_public_tree.py --history
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node packaging/build_frontend.cjs --check

  regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python package and test dependencies
        run: |
          python -m pip install -e . --no-deps
          python -m pip install "pytest==9.0.3" "Flask==3.1.3" "gpiozero==2.0.1.post3" "gunicorn==26.2.0"
          # lgpio requires Raspberry Pi-specific native libraries; hardware-independent tests must not install it.
      - name: Run Python regression tests
        run: python -m pytest -q packaging/test_*.py
      - name: Run JavaScript regression tests
        run: |
          set -e
          for test_file in packaging/test_*.cjs; do
            echo "Running ${test_file}"
            node "${test_file}"
          done
