[build-system]
requires = ["setuptools==79.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "event-logger"
version = "1.0.1"
description = "Local 24V event logger for the Raspberry Pi 24V I/O HAT"
requires-python = ">=3.13,<3.14"
license = {file = "LICENSE"}
dependencies = [
    "Flask==3.1.3",
    "gunicorn==26.2.0",
    "gpiozero==2.0.1.post3",
    "lgpio==0.2.2.0",
]

[project.optional-dependencies]
dev = [
    "mypy==1.20.2",
    "pytest==8.4.2",
    "ruff==0.16.8",
]

[project.scripts]
event-loggerd = "event_logger.loggerd.main:main"
event-logger-maintenance = "event_logger.maintenance.main:main"
event-logger-migrate = "event_logger.maintenance.migrate:main"
event-logger-backup = "event_logger.maintenance.backup:main"
event-logger-health = "event_logger.maintenance.health:main"
event-logger-update-agent = "event_logger.maintenance.update_agent:main"
event-logger-apply-hostname = "event_logger.maintenance.hostname:main"
event-logger-web = "event_logger.web.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
event_logger = ["database/schema.sql", "web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "hardware: requires Raspberry Pi hardware and the 24V I/O HAT",
]

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["gpiozero", "gpiozero.pins.lgpio"]
ignore_missing_imports = true
